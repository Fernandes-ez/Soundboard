<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Caixinha Sinistra">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#090710">

    <title>Caixinha Sinistra</title>

    <link href="https://fonts.googleapis.com/css?family=Pirata+One" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #090710;
            color: #eee8f5;
            font-family: Georgia, "Times New Roman", serif;
        }

        body {
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        button,
        select {
            font-family: inherit;
        }

        /* TEMAS */

        body.theme-dark {
            --accent: #a879e8;
            --accent-soft: #7041a0;
            --accent-faint: rgba(168, 121, 232, .12);
            --panel: rgba(20, 14, 29, .94);
            --panel-border: rgba(168, 121, 232, .27);
            --text: #eee8f5;
            --muted: #a99bb8;
            --background: #090710;
        }

        body.theme-west {
            --accent: #d2a16c;
            --accent-soft: #895b35;
            --accent-faint: rgba(210, 161, 108, .12);
            --panel: rgba(27, 19, 15, .95);
            --panel-border: rgba(210, 161, 108, .3);
            --text: #f0e4d2;
            --muted: #b8a18a;
            --background: #100b08;
        }

        body.theme-magic {
            --accent: #b4a7f5;
            --accent-soft: #7464bc;
            --accent-faint: rgba(180, 167, 245, .13);
            --panel: rgba(19, 17, 37, .95);
            --panel-border: rgba(180, 167, 245, .3);
            --text: #eeebff;
            --muted: #aaa4ce;
            --background: #090914;
        }

        body.theme-paranormal {
            --accent: #80b99a;
            --accent-soft: #426f5b;
            --accent-faint: rgba(128, 185, 154, .12);
            --panel: rgba(12, 24, 19, .95);
            --panel-border: rgba(128, 185, 154, .3);
            --text: #e5f0e8;
            --muted: #9db5a5;
            --background: #080e0b;
        }

        body.theme-crimson {
            --accent: #d47777;
            --accent-soft: #8e3838;
            --accent-faint: rgba(212, 119, 119, .12);
            --panel: rgba(30, 13, 16, .95);
            --panel-border: rgba(212, 119, 119, .3);
            --text: #f4e7e7;
            --muted: #b99a9a;
            --background: #100708;
        }

        body.theme-ocean {
            --accent: #79b9c8;
            --accent-soft: #3e7788;
            --accent-faint: rgba(121, 185, 200, .12);
            --panel: rgba(12, 23, 29, .95);
            --panel-border: rgba(121, 185, 200, .3);
            --text: #e4f0f3;
            --muted: #9db7bf;
            --background: #080e12;
        }

        body.theme-forest {
            --accent: #a1b77a;
            --accent-soft: #627b45;
            --accent-faint: rgba(161, 183, 122, .12);
            --panel: rgba(19, 24, 14, .95);
            --panel-border: rgba(161, 183, 122, .3);
            --text: #edf0e5;
            --muted: #adb69a;
            --background: #0a0e08;
        }

        body.theme-gold {
            --accent: #d7bd79;
            --accent-soft: #90783e;
            --accent-faint: rgba(215, 189, 121, .12);
            --panel: rgba(27, 23, 13, .95);
            --panel-border: rgba(215, 189, 121, .3);
            --text: #f1eddf;
            --muted: #bdb294;
            --background: #100e08;
        }

        body {
            background: var(--background);
            color: var(--text);
            transition: background .3s ease, color .3s ease;
        }

        /* ILUSTRAÇÕES SVG */

        .background-art {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            opacity: .7;
        }

        .background-art svg {
            width: 100%;
            height: 100%;
        }

        .art-stroke {
            fill: none;
            stroke: var(--accent-soft);
            stroke-width: 1.2;
            opacity: .45;
        }

        .art-thick {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            opacity: .18;
        }

        .art-fill {
            fill: var(--accent-soft);
            opacity: .16;
        }

        .art-detail {
            fill: none;
            stroke: var(--accent);
            stroke-width: .7;
            opacity: .32;
        }

        /* ESTRUTURA */

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 18px 45px;
        }

        header {
            text-align: center;
            padding: 22px 10px 26px;
            position: relative;
        }

        .eyebrow {
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 13px;
        }

        h1 {
            font-family: "Pirata One", Impact, "Arial Black", sans-serif;
            font-size: 62px;
            font-weight: normal;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0 var(--accent-soft);
            margin: 0;
            color: var(--accent);
            -webkit-transform: rotate(-2deg);
            transform: rotate(-2deg);
        }

        .subtitle {
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 12px;
            text-transform: uppercase;
        }

        .ornament {
            width: 150px;
            height: 1px;
            margin: 22px auto 0;
            background: var(--accent-soft);
            position: relative;
            opacity: .8;
        }

        .ornament:before,
        .ornament:after {
            content: "";
            position: absolute;
            top: -3px;
            width: 7px;
            height: 7px;
            border: 1px solid var(--accent);
            transform: rotate(45deg);
            background: var(--background);
        }

        .ornament:before {
            left: 0;
        }

        .ornament:after {
            right: 0;
        }

        /* PAINEL */

        .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 18px;
            margin-bottom: 17px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, .2);
        }

        .section-label {
            color: var(--accent);
            font-family: Arial, sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 13px;
        }

        /* CAMPANHAS */

        .system-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .system-tab {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--panel-border);
            padding: 11px 15px;
            font-size: 13px;
            cursor: pointer;
            min-height: 42px;
        }

        .system-tab.active {
            background: var(--accent-faint);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* CATEGORIAS */

        .category-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-button {
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--muted);
            padding: 9px 13px;
            font-size: 12px;
            cursor: pointer;
        }

        .category-button.active {
            color: var(--accent);
            background: var(--accent-faint);
            border-color: var(--accent);
        }

        /* ÁUDIOS */

        /* Sem CSS Grid: o Safari do iOS 9 não suporta. Quadrados via inline-block + padding-top. */
        .sound-grid {
            font-size: 0;
            margin: 0 -1%;
        }

        .sound-grid .message {
            font-size: 14px;
            margin: 0 1%;
        }

        .sound-item {
            display: inline-block;
            vertical-align: top;
            position: relative;
            width: 23%;
            margin: 1%;
            border: 1px solid var(--panel-border);
            background: rgba(0, 0, 0, .16);
        }

        .sound-item:before {
            content: "";
            display: block;
            padding-top: 100%;
        }

        .sound-main {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 38px;
            padding: 8px 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .play-button {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            padding: 0 0 0 3px;
            line-height: 46px;
            text-align: center;
            flex-shrink: 0;
            border: 1px solid var(--accent-soft);
            background: var(--accent-faint);
            color: var(--accent);
            font-size: 15px;
            cursor: pointer;
        }

        .play-button.playing {
            padding-left: 0;
            background: var(--accent);
            color: var(--background);
            border-color: var(--accent);
        }

        .sound-info {
            min-width: 0;
            width: 100%;
        }

        .sound-name {
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.25;
            max-height: 2.5em;
            overflow: hidden;
        }

        .sound-state {
            font-family: Arial, sans-serif;
            color: var(--muted);
            font-size: 9px;
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .loop-button {
            display: block;
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 8px;
            padding: 7px 4px;
            border: 1px solid rgba(255, 255, 255, .09);
            background: transparent;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 10px;
            cursor: pointer;
            text-align: center;
        }

        .loop-button.active {
            color: var(--accent);
            border-color: var(--accent-soft);
            background: var(--accent-faint);
        }

        /* CONTROLES */

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .control-button {
            border: 1px solid var(--panel-border);
            background: transparent;
            color: var(--muted);
            padding: 10px 13px;
            font-size: 11px;
            cursor: pointer;
        }

        .control-button.primary {
            border-color: var(--accent);
            color: var(--accent);
        }

        .control-button.danger {
            border-color: rgba(205, 90, 90, .5);
            color: #d58a8a;
        }

        .settings {
            display: none;
            margin-top: 15px;
            border-top: 1px solid var(--panel-border);
            padding-top: 15px;
        }

        .settings.open {
            display: block;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .settings label {
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        .settings select {
            max-width: 100%;
            padding: 9px;
            background: var(--background);
            color: var(--text);
            border: 1px solid var(--panel-border);
            font-size: 12px;
        }

        /* ESTADOS */

        .message {
            padding: 28px 12px;
            text-align: center;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 1.7;
        }

        .message strong {
            display: block;
            color: var(--accent);
            font-family: Georgia, serif;
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .status {
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 10px;
            text-align: center;
            margin-top: 16px;
            letter-spacing: 1px;
        }

        .status.error {
            color: #d58a8a;
        }

        footer {
            text-align: center;
            margin-top: 32px;
            color: var(--muted);
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 2px;
            opacity: .7;
        }

        @media (max-width: 520px) {
            .app {
                padding: 12px 11px 30px;
            }

            h1 {
                font-size: 42px;
            }

            .panel {
                padding: 13px;
            }

            .sound-item {
                width: 48%;
            }

            .system-tab {
                flex: 1 1 auto;
            }
        }

        /* ESTILO MANUAL: tinta, raízes, sem caixas de template */
        .background-art { opacity: .6; }
        .ink-line { fill: none; stroke: var(--accent); stroke-width: 1.1; opacity: .38; }
        .ink-fill { fill: var(--accent-soft); stroke: var(--accent-soft); stroke-width: .8; opacity: .17; }
        .root { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1; opacity: .3; }

        .panel { background: transparent; border: 0; box-shadow: none; padding: 4px 4px 12px; margin-bottom: 20px; }
        .section-label { display: inline-block; font-family: "Pirata One", Georgia, serif; font-size: 24px; text-transform: none; letter-spacing: 1px; padding-bottom: 4px; margin-bottom: 14px; border-bottom: 2px solid var(--accent-soft); }

        .system-tab, .category-button { font-family: "Pirata One", Georgia, serif; font-size: 18px; letter-spacing: .5px; border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 6px 12px; min-height: 0; }
        .system-tab.active, .category-button.active { background: transparent; border-bottom-color: var(--accent); color: var(--accent); }

        .sound-item { border: 2px solid var(--accent-soft); border-radius: 30px 6px 26px 8px / 8px 28px 6px 32px; background: rgba(0, 0, 0, .3); }
        .sound-item:nth-child(3n+1) { -webkit-transform: rotate(-.7deg); transform: rotate(-.7deg); }
        .sound-item:nth-child(3n+2) { -webkit-transform: rotate(.5deg); transform: rotate(.5deg); }
        .sound-item:nth-child(3n) { -webkit-transform: rotate(-.3deg); transform: rotate(-.3deg); }
        .sound-name { font-family: "Pirata One", Georgia, serif; font-size: 17px; letter-spacing: .5px; }

        .play-button { width: 60px; height: 60px; line-height: 60px; font-size: 44px; border: 0; background: transparent; color: var(--accent); padding: 0 0 0 4px; margin-bottom: 4px; }
        .play-button.playing { background: transparent; color: var(--text); padding-left: 0; text-shadow: 0 0 10px var(--accent); }

        .loop-button { border: 0; border-top: 1px dashed var(--accent-soft); background: transparent; }
        .loop-button.active { background: transparent; color: var(--accent); }
    </style>
</head>

    </div>

    <main class="app">

        <header>
            <h1>Caixinha Sinistra</h1>
        </header>
        <section class="panel">
            <div class="section-label">Campanhas</div>
            <div class="system-tabs" id="systemTabs">
                <div class="message">Carregando campanhas...</div>
            </div>
        </section>

        <section class="panel">
            <div class="section-label">Categorias</div>
            <div class="category-list" id="categories">
                <div class="message">Selecione uma campanha.</div>
            </div>
        </section>

        <section class="panel">
            <div class="section-label">Biblioteca de sons</div>
            <div class="sound-grid" id="soundGrid">
                <div class="message">
                    <strong>Aguardando conexão</strong>
                    Os sons da sua campanha aparecerão aqui.
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="controls">
                <button class="control-button danger" id="stopAll">■ Parar todos</button>
                <button class="control-button primary" id="refresh">↻ Atualizar Drive</button>
                <button class="control-button" id="settingsToggle">⚙ Aparência</button>
            </div>

            <div class="settings" id="settings">
                <div class="settings-row">
                    <label for="themeSelect">Identidade visual desta campanha</label>
                    <select id="themeSelect">
                        <option value="theme-dark">Dark Fantasy</option>
                        <option value="theme-west">Velho Oeste</option>
                        <option value="theme-magic">Mundo Mágico</option>
                        <option value="theme-paranormal">Ordem Paranormal</option>
                        <option value="theme-crimson">Crimson</option>
                        <option value="theme-ocean">Ocean</option>
                        <option value="theme-forest">Forest</option>
                        <option value="theme-gold">Golden</option>
                    </select>
                </div>
            </div>

            <div class="status" id="status">Conectando ao Google Drive...</div>
        </section>

        <footer>
            caixinha sinistra
        </footer>

    </main>

    <script>
        /* =========================================
           CONFIGURAÇÃO
        ========================================= */

        var API_URL = "https://script.google.com/macros/s/AKfycbxglxDwer9Ycu4fe-6LVRlaD1MPp7aDG0EW5VR51nYYTwRVb24Cc1r6MIONOpdB7wC6cg/exec";

        var campaigns = [];
        var currentCampaign = null;
        var currentCategory = null;
        var activeSounds = [];
        var requestTimeout = null;

        var themes = [
            "theme-dark",
            "theme-west",
            "theme-magic",
            "theme-paranormal",
            "theme-crimson",
            "theme-ocean",
            "theme-forest",
            "theme-gold"
        ];

        /* =========================================
           ELEMENTOS
        ========================================= */

        var systemTabs = document.getElementById("systemTabs");
        var categoriesElement = document.getElementById("categories");
        var soundGrid = document.getElementById("soundGrid");
        var statusElement = document.getElementById("status");
        var themeSelect = document.getElementById("themeSelect");
        var settingsElement = document.getElementById("settings");

        /* =========================================
           UTILITÁRIOS
        ========================================= */

        function setStatus(message, error) {
            statusElement.innerHTML = "";
            statusElement.appendChild(document.createTextNode(message));

            if (error) {
                statusElement.className = "status error";
            } else {
                statusElement.className = "status";
            }
        }

        function createElement(tag, className, text) {
            var element = document.createElement(tag);

            if (className) {
                element.className = className;
            }

            if (text !== undefined && text !== null) {
                element.appendChild(document.createTextNode(text));
            }

            return element;
        }

        function getThemeForCampaign(campaign, index) {
            var savedTheme = null;

            try {
                savedTheme = localStorage.getItem("rpg_palette_" + campaign.id);
            } catch (e) { }

            if (savedTheme && themes.indexOf(savedTheme) !== -1) {
                return savedTheme;
            }

            var name = campaign.name.toLowerCase();

            if (name.indexOf("oeste") !== -1) return "theme-west";
            if (name.indexOf("mágico") !== -1 || name.indexOf("magico") !== -1) return "theme-magic";
            if (name.indexOf("paranormal") !== -1) return "theme-paranormal";
            if (name.indexOf("fantasy") !== -1) return "theme-dark";

            return themes[index % themes.length];
        }

        function applyTheme(theme) {
            document.body.className = theme;
        }

        function saveTheme(theme) {
            if (!currentCampaign) return;

            try {
                localStorage.setItem(
                    "rpg_palette_" + currentCampaign.id,
                    theme
                );
            } catch (e) { }

            applyTheme(theme);
        }

        /* =========================================
           CONEXÃO COM GOOGLE APPS SCRIPT
           JSONP: compatível com Safari antigo
        ========================================= */

        function loadDriveData() {
            setStatus("Sincronizando com Google Drive...", false);

            var oldScript = document.getElementById("driveJsonp");

            if (oldScript && oldScript.parentNode) {
                oldScript.parentNode.removeChild(oldScript);
            }

            if (requestTimeout) {
                clearTimeout(requestTimeout);
            }

            requestTimeout = setTimeout(function () {
                setStatus("Tempo de conexão esgotado. Tente atualizar.", true);
            }, 20000);

            var script = document.createElement("script");
            script.id = "driveJsonp";

            script.onerror = function () {
                clearTimeout(requestTimeout);
                setStatus("Não foi possível conectar ao Google Drive.", true);
            };

            script.src = API_URL +
                "?callback=receiveSoundboardData&ts=" +
                new Date().getTime();

            document.getElementsByTagName("head")[0].appendChild(script);
        }

        window.receiveSoundboardData = function (data) {
            clearTimeout(requestTimeout);

            if (!data || !data.success) {
                setStatus("A API retornou um erro.", true);
                return;
            }

            if (!data.campaigns) {
                setStatus("Resposta da API sem campanhas.", true);
                return;
            }

            campaigns = data.campaigns;

            stopAllSounds();

            if (campaigns.length === 0) {
                currentCampaign = null;

                systemTabs.innerHTML = "";
                categoriesElement.innerHTML = "";
                soundGrid.innerHTML = "";

                systemTabs.appendChild(createElement(
                    "div",
                    "message",
                    "Nenhuma campanha encontrada. Verifique as pastas no Drive."
                ));

                categoriesElement.appendChild(createElement(
                    "div",
                    "message",
                    "Crie categorias dentro das pastas das campanhas."
                ));

                soundGrid.appendChild(createElement(
                    "div",
                    "message",
                    "Adicione arquivos MP3 às categorias para começar."
                ));

                setStatus("Conectado, mas nenhuma campanha foi encontrada.");
                return;
            }

            renderCampaigns();

            var previousId = null;

            try {
                previousId = localStorage.getItem("rpg_last_campaign");
            } catch (e) { }

            var selectedIndex = 0;

            if (previousId) {
                for (var i = 0; i < campaigns.length; i++) {
                    if (campaigns[i].id === previousId) {
                        selectedIndex = i;
                        break;
                    }
                }
            }

            selectCampaign(selectedIndex);

            setStatus(
                "Drive sincronizado · " +
                campaigns.length +
                " campanha(s) encontrada(s)."
            );
        };

        /* =========================================
           CAMPANHAS
        ========================================= */

        function renderCampaigns() {
            systemTabs.innerHTML = "";

            for (var i = 0; i < campaigns.length; i++) {
                (function (index) {
                    var campaign = campaigns[index];

                    var button = createElement(
                        "button",
                        "system-tab",
                        campaign.name
                    );

                    button.type = "button";

                    button.onclick = function () {
                        selectCampaign(index);
                    };

                    systemTabs.appendChild(button);
                })(i);
            }
        }

        function selectCampaign(index) {
            if (index < 0 || index >= campaigns.length) return;

            stopAllSounds();

            currentCampaign = campaigns[index];
            currentCategory = null;

            var theme = getThemeForCampaign(currentCampaign, index);

            applyTheme(theme);
            themeSelect.value = theme;

            try {
                localStorage.setItem(
                    "rpg_last_campaign",
                    currentCampaign.id
                );
            } catch (e) { }

            updateCampaignButtons();
            renderCategories();
        }

        function updateCampaignButtons() {
            var buttons = systemTabs.getElementsByTagName("button");

            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = "system-tab";

                if (campaigns[i] === currentCampaign) {
                    buttons[i].className += " active";
                }
            }
        }

        /* =========================================
           CATEGORIAS
        ========================================= */

        function renderCategories() {
            categoriesElement.innerHTML = "";
            soundGrid.innerHTML = "";

            if (!currentCampaign) return;

            var categories = currentCampaign.categories || [];

            if (categories.length === 0) {
                categoriesElement.appendChild(createElement(
                    "div",
                    "message",
                    "Esta campanha ainda não possui categorias."
                ));

                soundGrid.appendChild(createMessage(
                    "Biblioteca vazia",
                    "Crie pastas dentro da campanha no Google Drive."
                ));

                return;
            }

            for (var i = 0; i < categories.length; i++) {
                (function (index) {
                    var category = categories[index];

                    var button = createElement(
                        "button",
                        "category-button",
                        category.name
                    );

                    button.type = "button";

                    button.onclick = function () {
                        selectCategory(index);
                    };

                    categoriesElement.appendChild(button);
                })(i);
            }

            selectCategory(0);
        }

        function selectCategory(index) {
            if (!currentCampaign) return;

            var categories = currentCampaign.categories || [];

            if (index < 0 || index >= categories.length) return;

            currentCategory = categories[index];

            var buttons = categoriesElement.getElementsByTagName("button");

            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = "category-button";

                if (categories[i] === currentCategory) {
                    buttons[i].className += " active";
                }
            }

            renderSounds();
        }

        /* =========================================
           ÁUDIOS
        ========================================= */

        function renderSounds() {
            soundGrid.innerHTML = "";

            if (!currentCategory) {
                soundGrid.appendChild(createMessage(
                    "Selecione uma categoria",
                    "Escolha uma categoria para visualizar os sons."
                ));
                return;
            }

            var sounds = currentCategory.sounds || [];

            if (sounds.length === 0) {
                soundGrid.appendChild(createMessage(
                    "Nenhum áudio encontrado",
                    "Adicione arquivos MP3 nesta pasta do Google Drive e toque em Atualizar Drive."
                ));
                return;
            }

            for (var i = 0; i < sounds.length; i++) {
                renderSound(sounds[i]);
            }
        }

        function renderSound(sound) {
            var item = createElement("div", "sound-item");
            var main = createElement("div", "sound-main");

            var playButton = createElement(
                "button",
                "play-button",
                "▶︎"
            );

            playButton.type = "button";

            var info = createElement("div", "sound-info");

            var name = createElement(
                "div",
                "sound-name",
                sound.name
            );

            var state = createElement(
                "div",
                "sound-state",
                "PRONTO"
            );

            info.appendChild(name);
            info.appendChild(state);

            main.appendChild(playButton);
            main.appendChild(info);

            var loopButton = createElement(
                "button",
                "loop-button",
                sound.loop ? "↻ Loop ativado" : "↻ Loop desativado"
            );

            loopButton.type = "button";

            if (sound.loop) {
                loopButton.className += " active";
            }

            playButton.onclick = function () {
                toggleSound(sound, playButton, state);
            };

            loopButton.onclick = function () {
                sound.loop = !sound.loop;

                loopButton.className = sound.loop
                    ? "loop-button active"
                    : "loop-button";

                loopButton.innerHTML = sound.loop
                    ? "↻ Loop ativado"
                    : "↻ Loop desativado";

                updateActiveLoop(sound);
            };

            item.appendChild(main);
            item.appendChild(loopButton);

            soundGrid.appendChild(item);
        }

        function toggleSound(sound, button, state) {
            var existing = findActiveSound(sound.id);

            if (existing) {
                stopSound(existing);

                button.className = "play-button";
                button.innerHTML = "▶︎";
                state.innerHTML = "PRONTO";

                return;
            }

            if (!sound.url) {
                setStatus("Este áudio não possui um endereço válido.", true);
                return;
            }

            // iOS 9 não confia no certificado do workers.dev; o áudio passa pelo domínio da Vercel (ver vercel.json)
            var audio = new Audio(sound.url.replace(/^https:\/\/rpg-soundboard-audio\.enzo-dantas\.workers\.dev\/\?/, "/a2?"));

            audio.loop = !!sound.loop;
            audio.preload = "auto";

            var active = {
                id: sound.id,
                audio: audio,
                button: button,
                state: state
            };

            activeSounds.push(active);

            button.className = "play-button playing";
            button.innerHTML = "■";
            state.innerHTML = "REPRODUZINDO";

            // Loop sem silêncio: volta ao início um pouco antes do fim (timeupdate dispara a cada ~250 ms no iOS)
            audio.ontimeupdate = function () {
                var d = audio.duration;

                if (sound.loop && d && isFinite(d) && d > 3 && d - audio.currentTime < 0.4) {
                    try {
                        audio.currentTime = 0;
                    } catch (e) { }
                }
            };

            audio.onended = function () {
                removeActiveSound(active);
                button.className = "play-button";
                button.innerHTML = "▶︎";
                state.innerHTML = "PRONTO";
            };

            audio.onerror = function () {
                removeActiveSound(active);
                button.className = "play-button";
                button.innerHTML = "▶︎";
                state.innerHTML = "ERRO AO CARREGAR";
            };

            audio.load();
            var playResult = audio.play();

            if (playResult && typeof playResult.then === "function") {
                playResult.then(function () {
                    state.innerHTML = "REPRODUZINDO";
                }, function () {
                    removeActiveSound(active);
                    button.className = "play-button";
                    button.innerHTML = "▶︎";
                    state.innerHTML = "TOQUE PARA TENTAR";
                });
            }
        }

        function findActiveSound(id) {
            for (var i = 0; i < activeSounds.length; i++) {
                if (activeSounds[i].id === id) {
                    return activeSounds[i];
                }
            }

            return null;
        }

        function updateActiveLoop(sound) {
            var active = findActiveSound(sound.id);

            if (active) {
                active.audio.loop = !!sound.loop;
            }
        }

        function stopSound(active) {
            if (!active) return;

            active.audio.pause();

            try {
                active.audio.currentTime = 0;
            } catch (e) { }

            active.button.className = "play-button";
            active.button.innerHTML = "▶︎";
            active.state.innerHTML = "PRONTO";

            removeActiveSound(active);
        }

        function removeActiveSound(active) {
            for (var i = activeSounds.length - 1; i >= 0; i--) {
                if (activeSounds[i] === active) {
                    activeSounds.splice(i, 1);
                    break;
                }
            }
        }

        function stopAllSounds() {
            for (var i = activeSounds.length - 1; i >= 0; i--) {
                var active = activeSounds[i];

                active.audio.pause();

                try {
                    active.audio.currentTime = 0;
                } catch (e) { }

                active.button.className = "play-button";
                active.button.innerHTML = "▶︎";
                active.state.innerHTML = "PRONTO";
            }

            activeSounds = [];
        }

        function createMessage(title, description) {
            var box = createElement("div", "message");
            box.appendChild(createElement("strong", "", title));
            box.appendChild(document.createTextNode(description));
            return box;
        }

        /* =========================================
           CONFIGURAÇÕES
        ========================================= */

        document.getElementById("stopAll").onclick = function () {
            stopAllSounds();
            setStatus("Todos os áudios foram interrompidos.");
        };

        document.getElementById("refresh").onclick = function () {
            loadDriveData();
        };

        document.getElementById("settingsToggle").onclick = function () {
            if (settingsElement.className.indexOf("open") !== -1) {
                settingsElement.className = "settings";
            } else {
                settingsElement.className = "settings open";
            }
        };

        themeSelect.onchange = function () {
            saveTheme(themeSelect.value);
        };

        /* =========================================
           INICIALIZAÇÃO
        ========================================= */

        loadDriveData();

    </script>

</body>

</html>
