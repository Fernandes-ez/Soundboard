<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Teste 2</title></head>
<body>
<button id="b" style="font-size:24px;padding:16px">PLAY TOM</button>
<pre id="log" style="font-size:16px"></pre>
<script>
function w(t){ document.getElementById('log').appendChild(document.createTextNode(t + '\n')); }

// WAV 8-bit mono, 8000 Hz, 1 s, tom de 440 Hz
var n = 8000, s = '';
function le32(v){ return String.fromCharCode(v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255); }
function le16(v){ return String.fromCharCode(v&255,(v>>8)&255); }
s += 'RIFF' + le32(36+n) + 'WAVEfmt ' + le32(16) + le16(1) + le16(1) +
     le32(8000) + le32(8000) + le16(1) + le16(8) + 'data' + le32(n);
for (var i = 0; i < n; i++) {
  s += String.fromCharCode(128 + Math.round(100 * Math.sin(2*Math.PI*440*i/8000)));
}

var a = new Audio();
var ev = ['loadstart','loadedmetadata','canplay','playing','ended','error'];
for (var k = 0; k < ev.length; k++) {
  (function(name){ a.addEventListener(name, function(){
    w(name + ' rs=' + a.readyState + ' ns=' + a.networkState +
      (a.error ? ' err=' + a.error.code : '')); }, false); })(ev[k]);
}
a.src = 'data:audio/wav;base64,' + btoa(s);
document.getElementById('b').onclick = function(){ a.load(); a.play(); };
w('pronto');
</script>
</body></html>
