<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Teste 3</title></head>
<body>
<button id="b" style="font-size:24px;padding:16px">PLAY MP3</button>
<p><a href="https://rpg-soundboard-audio.enzo-dantas.workers.dev/?id=1k1wFqgIXhCBOeupnwA7aGU2ojfGd7TlY" style="display:block;font-size:24px;padding:16px;border:2px solid #000;text-align:center">ABRIR WORKER</a></p>
<pre id="log" style="font-size:16px"></pre>
<script>
function w(t){ document.getElementById('log').appendChild(document.createTextNode(t + '\n')); }
var a = new Audio();
var ev = ['loadstart','loadedmetadata','canplay','playing','ended','error','stalled','suspend'];
for (var k = 0; k < ev.length; k++) {
  (function(name){ a.addEventListener(name, function(){
    w(name + ' rs=' + a.readyState + ' ns=' + a.networkState +
      (a.error ? ' err=' + a.error.code : '')); }, false); })(ev[k]);
}
a.src = 'teste3.mp3';
document.getElementById('b').onclick = function(){ a.load(); a.play(); };
w('pronto');
</script>
</body></html>
